global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'app_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  - name: 'default'
    # 配置 Webhook 或邮件通知
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/alert'
    # email_configs:
    #   - to: 'your@email.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'

  - name: 'critical'
    # 同上，可配置不同的通知渠道
